        header{

    background:#0f172a;

    color:white;

<body>

<script>

    // =========================================
    // FIREBASE AUTHENTICATION
    // =========================================

    const firebaseConfig = {

        apiKey: "AIzaSyB8TR8FOncZxeKGtqVR9wAA1UDC3Hy5CEI",

        authDomain:
            "mapa-tributo-tabatinga-am.firebaseapp.com",

        projectId:
            "mapa-tributo-tabatinga-am",

        storageBucket:
            "mapa-tributo-tabatinga-am.firebasestorage.app",

        messagingSenderId:
            "1097315928329",

        appId:
            "1:1097315928329:web:f8574d082cf7b5eeebebd8"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const db = firebase.firestore();
    const colecaoEstabelecimentos = db.collection("estabelecimentos");
    let usuarioEhAdmin = false;
    let estabelecimentoEmEdicao = null;

    // =========================================
    // ELEMENTOS DO LOGIN
    // =========================================

    const loginScreen =
        document.getElementById("loginScreen");

    const loginEmail =
        document.getElementById("loginEmail");

    const loginSenha =
        document.getElementById("loginSenha");

    const btnLogin =
        document.getElementById("btnLogin");

    const loginErro =
        document.getElementById("loginErro");

    const btnSair =
        document.getElementById("btnSair");

    // =========================================
    // CONTROLE DA INTERFACE
    // =========================================

    function mostrarSistema(){

        loginScreen.style.display = "none";

        document.getElementById("header")
            .style.display = "flex";

        document.getElementById("dashboard")
            .style.display = "flex";

        document.getElementById("toolbar")
            .style.display = "flex";

        document.getElementById("map")
            .style.display = "block";
        document.getElementById("statusSistema").style.display = "block";

        setTimeout(() => {

            map.invalidateSize();

        }, 100);

    }

    function ocultarSistema(){

        loginScreen.style.display = "flex";

        document.getElementById("header")
            .style.display = "none";

        document.getElementById("dashboard")
            .style.display = "none";

        document.getElementById("toolbar")
            .style.display = "none";

        document.getElementById("map")
            .style.display = "none";
        document.getElementById("statusSistema").style.display = "none";

        markersLayer.clearLayers();

    }

    // =========================================
    // LOGIN
    // =========================================

    async function fazerLogin(){

        const email =
            loginEmail.value.trim();

        const senha =
            loginSenha.value;

        loginErro.innerText = "";

        if(!email || !senha){

            loginErro.innerText =
                "Informe o e-mail e a senha.";

            return;
        }

        btnLogin.disabled = true;

        btnLogin.innerText =
            "Entrando...";

        try{

            await auth.signInWithEmailAndPassword(
                email,
                senha
            );

        }
        catch(erro){

            console.error(
                "Erro de autenticação:",
                erro
            );

            if(
                erro.code ===
                "auth/invalid-credential" ||
                erro.code ===
                "auth/wrong-password" ||
                erro.code ===
                "auth/user-not-found"
            ){

                loginErro.innerText =
                    "E-mail ou senha inválidos.";

            }
            else if(
                erro.code ===
                "auth/too-many-requests"
            ){

                loginErro.innerText =
                    "Muitas tentativas. Aguarde alguns minutos.";

            }
            else{

                loginErro.innerText =
                    "Não foi possível entrar. Tente novamente.";
            }

        }
        finally{

            btnLogin.disabled = false;

            btnLogin.innerText =
                "Entrar";
        }
    }

    btnLogin.addEventListener(
        "click",
        fazerLogin
    );

    loginSenha.addEventListener(
        "keydown",
        evento => {

            if(evento.key === "Enter"){

                fazerLogin();

            }

        }
    );

    btnSair.addEventListener(
        "click",
        async () => {

            await auth.signOut();

        }
    );

    // =========================================
    // PLANILHA LEGADA: USADA APENAS NA IMPORTAÇÃO INICIAL
    // =========================================

    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOM8TKzlEsV-44u5CVmcQvMd70TZlOV6r-Y3YTqWtj0oWlFVuck-wbNU18JQEmHqEKfwd3gbIc_zvt/pub?output=csv";

    // =========================================
    // MAPA
    // =========================================

    const map = L.map('map').setView(
        [-4.252, -69.938],
        13
    );

    // =========================================
    // CAMADA
    // =========================================

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 20
        }
    ).addTo(map);

    // =========================================
    // CLUSTER
    // =========================================

    const markersLayer = L.layerGroup();

    map.addLayer(markersLayer);

    // =========================================
    // ICONES
    // =========================================

    function criarIcone(cor){

        return L.divIcon({

            html: `
                <div style="
                    background:${cor};
                    width:18px;
                    height:18px;
                    border-radius:50%;
                    border:3px solid white;
                    box-shadow:0 0 5px rgba(0,0,0,0.5);
                "></div>
            `,

            className: ""

        });
    }

    const iconGreen =
        criarIcone("green");

    const iconRed =
        criarIcone("red");

    const iconOrange =
        criarIcone("orange");

    // =========================================
    // SEGURANÇA
    // =========================================

    function escapeHTML(str){

        return String(str || "")

            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // =========================================
    // DASHBOARD
    // =========================================

    function atualizarDashboard(lista){

        let total = lista.length;

        let lic = 0;
        let irr = 0;
        let pend = 0;

        lista.forEach(est => {

            const status =
                String(est.Licenciado || "")
                .toLowerCase()
                .trim();

            if(status === "sim"){

                lic++;
            }
            else if(status === "pendente"){

                pend++;
            }
            else{

                irr++;
            }

        });

        document
            .getElementById("total")
            .innerText = total;

        document
            .getElementById("licenciados")
            .innerText = lic;

        document
            .getElementById("irregulares")
            .innerText = irr;

        document
            .getElementById("pendentes")
            .innerText = pend;
    }

    // =========================================
    // GPS USUARIO
    // =========================================

    function ativarLocalizacao(){

        if(!navigator.geolocation){

            return;
        }

        navigator.geolocation.getCurrentPosition(

            pos => {

                const lat =
                    pos.coords.latitude;

                const lng =
                    pos.coords.longitude;

                L.circleMarker(
                    [lat, lng],
                    {
                        radius: 8
                    }
                )
                .addTo(map)
                .bindPopup("📍 Sua localização");

            },

            erro => {

                console.warn(
                    "Localização não disponível:",
                    erro.message
                );

            }

        );
    }

    // =========================================
    // DADOS EM MEMÓRIA
    // =========================================

    let dadosGlobais = [];

    // =========================================
    // CARREGAR DADOS DO FIRESTORE
    // =========================================

    function informar(mensagem) {
        document.getElementById("statusSistema").textContent = mensagem;
    }

    async function carregarDados(){
        try {
            informar("Carregando estabelecimentos do banco de dados...");
            const snapshot = await colecaoEstabelecimentos.get();
            dadosGlobais = snapshot.docs.map(doc => ({ ...doc.data(), _id: doc.id }));
            document.getElementById("btnImportarPlanilha").style.display =
                (usuarioEhAdmin && snapshot.empty) ? "inline-block" : "none";
            if (snapshot.empty) {
                informar(usuarioEhAdmin
                    ? "O Firestore ainda está vazio. Use ‘Importar planilha inicial’ para carregar os dados existentes."
                    : "Ainda não há estabelecimentos cadastrados no Firestore. Solicite ao administrador a importação inicial.");
            } else {
                informar(`${dadosGlobais.length} estabelecimento(s) carregado(s) do Firestore.`);
            }
            aplicarFiltros(dadosGlobais);
        } catch (erro) {
            console.error("Erro ao carregar Firestore:", erro);
            informar("Falha ao carregar dados. Confira a conexão e as regras do Firestore.");
            alert("Não foi possível carregar os estabelecimentos do Firestore. Confira as regras de segurança e a conexão.");
        }
    }

    function gerarIdEstabelecimento(est, indice) {
        // Inclui endereço, coordenadas e índice para evitar que dois pontos
        // com o mesmo CNPJ sejam fundidos em um único documento.
        const cnpj = String(est.CNPJ || "").replace(/\D/g, "");
        const base = [cnpj, est.NomeFantasia || est.Nome || "sem_nome", est.Endereco || "", est.Latitude || "", est.Longitude || "", indice]
            .join("|").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        let hash = 2166136261;
        for (let i = 0; i < base.length; i++) {
            hash ^= base.charCodeAt(i);
            hash = Math.imul(hash, 16777619);
        }
        return (cnpj ? "cnpj_" + cnpj + "_" : "est_") + (hash >>> 0).toString(16);
    }

    async function importarPlanilhaInicial() {
        if (!usuarioEhAdmin || !auth.currentUser) {
            alert("Somente o administrador pode importar a planilha.");
            return;
        }
        if (!confirm("Importar a planilha publicada para o Firestore? Faça isso apenas na migração inicial. A importação não deve ser repetida após começar a editar os dados.")) return;
        const botao = document.getElementById("btnImportarPlanilha");
        botao.disabled = true;
        botao.textContent = "Importando...";
        try {
            const existente = await colecaoEstabelecimentos.limit(1).get();
            if (!existente.empty) {
                alert("O Firestore já contém dados. A importação inicial foi bloqueada para evitar sobrescrever alterações.");
                await carregarDados();
                return;
            }
            const response = await fetch(sheetURL);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const csv = await response.text();
            const parsed = Papa.parse(csv, { header: true, skipEmptyLines: true });
            if (!parsed.data || !parsed.data.length) throw new Error("A planilha não contém registros.");
            let batch = db.batch();
            let noBatch = 0;
            let importados = 0;
            for (let i = 0; i < parsed.data.length; i++) {
                const est = parsed.data[i];
                if (!String(est.NomeFantasia || est.Nome || est.CNPJ || "").trim()) continue;
                const id = gerarIdEstabelecimento(est, i);
                batch.set(colecaoEstabelecimentos.doc(id), {
                    ...est,
                    NomeFantasia: String(est.NomeFantasia || ""),
                    Nome: String(est.Nome || ""),
                    CNPJ: String(est.CNPJ || ""),
                    Endereco: String(est.Endereco || ""),
                    Categoria: String(est.Categoria || ""),
                    Licenciado: normalizarStatus(est.Licenciado),
                    Latitude: String(est.Latitude || ""),
                    Longitude: String(est.Longitude || ""),
                    Foto: String(est.Foto || ""),
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
                    criadoPor: auth.currentUser.uid,
                    origem: "importacao_planilha_csv"
                });
                noBatch++;
                importados++;
                if (noBatch === 450) {
                    await batch.commit();
                    batch = db.batch();
                    noBatch = 0;
                }
            }
            if (noBatch > 0) await batch.commit();
            alert(`Importação concluída: ${importados} registro(s) enviados ao Firestore.`);
            await carregarDados();
        } catch (erro) {
            console.error("Erro na importação inicial:", erro);
            alert("A importação falhou. Confira o console e o Firestore. Se parte dos dados tiver sido gravada, peça ao administrador para verificar a coleção antes de tentar novamente.");
        } finally {
            botao.disabled = false;
            botao.textContent = "Importar planilha inicial";
        }
    }

// =========================================
// NORMALIZAR STATUS
// =========================================

function normalizarStatus(valor) {

    const status = String(valor || "")
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    if (status === "sim" || status === "licenciado") {
        return "sim";
    }

    if (
        status === "nao" ||
        status === "irregular" ||
        status === "nao licenciado"
    ) {
        return "nao";
    }

    if (status === "pendente") {
        return "pendente";
    }

    return "nao";
}    
    // =========================================
// DISTRIBUIR PONTOS SOBREPOSTOS
// =========================================

function ajustarCoordenada(lat, lng, indice, total) {

    if (total <= 1) {
        return [lat, lng];
    }

    // Raio aproximado do deslocamento em graus
    const raio = 0.00015;

    // Distribui os pontos em círculo
    const angulo =
        (2 * Math.PI * indice) / total;

    const novaLat =
        lat + Math.sin(angulo) * raio;

    const novaLng =
        lng + Math.cos(angulo) * raio;

    return [novaLat, novaLng];
}

        atualizarDashboard(filtrados);

});

            `;

            const chave =
    lat.toFixed(6) + "," + lng.toFixed(6);

const grupo =

const [novaLat, novaLng] =

const bounds = L.latLngBounds();

markersLayer.eachLayer(function (layer) {

});

if (bounds.isValid()) {

  });
}
            );
        }
    }
