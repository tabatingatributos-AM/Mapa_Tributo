    // =========================================
    // LOGIN
    // =========================================

    async function fazerLogin(){

        const email =
            loginEmail.value.trim();

        const senha =
            loginSenha.value;

        loginErro.innerText = "";

        if(!email || !senha){

            loginErro.innerText =
                "Informe o e-mail e a senha.";

            return;
        }

        btnLogin.disabled = true;

        btnLogin.innerText =
            "Entrando...";

        try{

            await auth.signInWithEmailAndPassword(
                email,
                senha
            );

        }
        catch(erro){

            console.error(
                "Erro de autenticação:",
                erro
            );

            if(
                erro.code ===
                "auth/invalid-credential" ||
                erro.code ===
                "auth/wrong-password" ||
                erro.code ===
                "auth/user-not-found"
            ){

                loginErro.innerText =
                    "E-mail ou senha inválidos.";

            }
            else if(
                erro.code ===
                "auth/too-many-requests"
            ){

                loginErro.innerText =
                    "Muitas tentativas. Aguarde alguns minutos.";

            }
            else{

                loginErro.innerText =
                    "Não foi possível entrar. Tente novamente.";
            }

        }
        finally{

            btnLogin.disabled = false;

            btnLogin.innerText =
                "Entrar";
        }
    }

    btnLogin.addEventListener(
        "click",
        fazerLogin
    );

    loginSenha.addEventListener(
        "keydown",
        evento => {

            if(evento.key === "Enter"){

                fazerLogin();

        }
    );

    btnSair.addEventListener(
        "click",

    );

    // =========================================
    // LINK DA PLANILHA
    // =========================================

    const sheetURL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOM8TKzlEsV-44u5CVmcQvMd70TZlOV6r-Y3YTqWtj0oWlFVuck-wbNU18JQEmHqEKfwd3gbIc_zvt/pub?output=csv";

    // =========================================
    // MAPA
    // =========================================

    const map = L.map('map').setView(
        [-4.252, -69.938],
        13
    );

    // =========================================
    // CAMADA
    // =========================================

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 20
        }
    ).addTo(map);

    // =========================================
    // CLUSTER
    // =========================================

    const markersLayer = L.layerGroup();

    map.addLayer(markersLayer);

    // =========================================
    // ICONES
    // =========================================

    function criarIcone(cor){

        return L.divIcon({

            html: `
                <div style="
                    background:${cor};
                    width:18px;
                    height:18px;
                    border-radius:50%;
                    border:3px solid white;
                    box-shadow:0 0 5px rgba(0,0,0,0.5);
                "></div>
            `,

            className: ""

        });
    }

    const iconGreen =
        criarIcone("green");

    const iconRed =
        criarIcone("red");

    const iconOrange =
        criarIcone("orange");

    // =========================================
    // SEGURANÇA
    // =========================================

    function escapeHTML(str){

        return String(str || "")

            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // =========================================
    // DASHBOARD
    // =========================================

    function atualizarDashboard(lista){

        let total = lista.length;

        let lic = 0;
        let irr = 0;
        let pend = 0;

        lista.forEach(est => {

            const status =
                String(est.Licenciado || "")
                .toLowerCase()
                .trim();

            if(status === "sim"){

                lic++;
            }
            else if(status === "pendente"){

                pend++;
            }
            else{

                irr++;
            }

        });

        document
            .getElementById("total")
            .innerText = total;

        document
            .getElementById("licenciados")
            .innerText = lic;

        document
            .getElementById("irregulares")
            .innerText = irr;

        document
            .getElementById("pendentes")
            .innerText = pend;
    }

    // =========================================
    // GPS USUARIO
    // =========================================

    function ativarLocalizacao(){

        if(!navigator.geolocation){

            return;
        }

        navigator.geolocation.getCurrentPosition(

            pos => {

                const lat =
                    pos.coords.latitude;

                const lng =
                    pos.coords.longitude;

                L.circleMarker(
                    [lat, lng],
                    {
                        radius: 8
                    }
                )
                .addTo(map)
                .bindPopup("📍 Sua localização");

            },

            erro => {

                console.warn(
                    "Localização não disponível:",
                    erro.message
                );

            }

        );
    }

    // =========================================
    // DADOS EM MEMÓRIA
    // =========================================

    let dadosGlobais = [];

    // =========================================
    // CARREGAR DADOS
    // =========================================

    async function carregarDados(){

        try{

            const response =
                await fetch(sheetURL);

            if(!response.ok){

                throw new Error(
                    "Servidor retornou HTTP " +
                    response.status
                );
            }

            const csv =
                await response.text();

            const resultado =
                Papa.parse(csv, {

                    header: true,

                    skipEmptyLines: true
                });

            if(
                resultado.errors &&
                resultado.errors.length > 0
            ){

                console.warn(
                    "Avisos do PapaParse:",
                    resultado.errors
                );
            }

            dadosGlobais =
                resultado.data;

            aplicarFiltros(
                dadosGlobais
            );

            console.log(
                "Planilha carregada:",
                dadosGlobais.length,
                "estabelecimentos"
            );

        }
        catch(erro){

            console.error(
                "Erro ao carregar planilha:",
                erro
            );

            if(
                dadosGlobais.length === 0
            ){

                alert(
                    "Não foi possível carregar os dados da planilha."
                );

            }
            else{

                console.warn(
                    "Falha na atualização. Mantendo os dados atuais."
                );

                aplicarFiltros(
                    dadosGlobais
                );
            }
        }
    }
// =========================================
// NORMALIZAR STATUS
// =========================================

function normalizarStatus(valor) {

    const status = String(valor || "")
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    if (status === "sim" || status === "licenciado") {
        return "sim";
    }

    if (
        status === "nao" ||
        status === "irregular" ||
        status === "nao licenciado"
    ) {
        return "nao";
    }

    if (status === "pendente") {
        return "pendente";
    }

    return "nao";
}    
    // =========================================
// DISTRIBUIR PONTOS SOBREPOSTOS
// =========================================

function ajustarCoordenada(lat, lng, indice, total) {

    if (total <= 1) {
        return [lat, lng];
    }

    // Raio aproximado do deslocamento em graus
    const raio = 0.00015;

    // Distribui os pontos em círculo
    const angulo =
        (2 * Math.PI * indice) / total;

    const novaLat =
        lat + Math.sin(angulo) * raio;

    const novaLng =
        lng + Math.cos(angulo) * raio;

    return [novaLat, novaLng];
}
    // =========================================
    // FILTROS
    // =========================================

    function aplicarFiltros(lista){

        markersLayer.clearLayers();

        const textoPesquisa =
            document
            .getElementById("pesquisa")
            .value
            .toLowerCase();

        const textoCategoria =
            document
            .getElementById("pesquisaCategoria")
            .value
            .toLowerCase();

        const filtro =
            document
            .getElementById("filtro")
            .value
            .toLowerCase();

        const filtrados = lista.filter(est => {

            const nome =
                String(
                    est.NomeFantasia ||
                    est.Nome ||
                    ""
                )
                .toLowerCase();

            const categoria =
                String(
                    est.Categoria || ""
                )
                .toLowerCase();

            const status = normalizarStatus(est.Licenciado);

            const pesquisaOK =
                nome.includes(textoPesquisa);

            const categoriaOK =
                categoria.includes(textoCategoria);

            const statusOK =
                filtro === ""
                ? true
                : status === filtro;

            return pesquisaOK &&
                   categoriaOK &&
                   statusOK;
        });

        atualizarDashboard(filtrados);

        // =========================================
// IDENTIFICAR COORDENADAS REPETIDAS
// =========================================

const coordenadas = {};

filtrados.forEach(est => {

    const lat = parseFloat(est.Latitude);
    const lng = parseFloat(est.Longitude);

    if (isNaN(lat) || isNaN(lng)) return;

    const chave =
        lat.toFixed(6) + "," + lng.toFixed(6);

    if (!coordenadas[chave]) {
        coordenadas[chave] = [];
    }

    coordenadas[chave].push(est);
});
        
        Object.values(coordenadas).forEach(grupo => {

        grupo.forEach((est, indice) => {

            const lat =
                parseFloat(est.Latitude);

            const lng =
                parseFloat(est.Longitude);

            if(
                isNaN(lat) ||
                isNaN(lng)
            ) return;

            let statusTexto =
                "Irregular";

            let statusClass =
                "status-irregular";

            let icon =
                iconRed;

            const status = normalizarStatus(est.Licenciado);

            if(status === "sim"){

                statusTexto =
                    "Licenciado";

                statusClass =
                    "status-licenciado";

                icon =
                    iconGreen;
            }

            else if(
                status === "pendente"
            ){

                statusTexto =
                    "Pendente";

                statusClass =
                    "status-pendente";

                icon =
                    iconOrange;
            }

            let foto =
                "Sem foto";

            if(
                est.Foto &&
                est.Foto.startsWith("http")
            ){

                foto = `
                    <img
                        class="popup-img"
                        src="${escapeHTML(est.Foto)}"
                    >
                `;
            }

            const popup = `

                <div class="popup-box">

                    <h3>
                        ${escapeHTML(
                            est.NomeFantasia ||
                            est.Nome
                        )}
                    </h3>

                    <small>

                        <b>Razão Social:</b>

                        ${escapeHTML(est.Nome)}

                    </small>

                    <hr>

                    <span class="${statusClass}">

                        ${statusTexto}

                    </span>

                    <br><br>

                    ${foto}

                    <br><br>

                    <b>📍 Endereço:</b><br>

                    ${escapeHTML(est.Endereco)}

                    <br><br>

                    <b>🏢 CNPJ:</b><br>

                    ${escapeHTML(est.CNPJ)}

                    <br><br>

                    <b>📂 Categoria:</b><br>

                    ${escapeHTML(est.Categoria)}

                </div>

            `;

            const chave =
    lat.toFixed(6) + "," + lng.toFixed(6);

const grupo =
    coordenadas[chave];

const [novaLat, novaLng] =
    ajustarCoordenada(
        lat,
        lng,
        indice,
        grupo.length
    );

const marker = L.marker(
    [novaLat, novaLng],
    { icon }
);

            marker.bindPopup(popup);

            markersLayer.addLayer(marker);

        });

    });


        // AJUSTA ZOOM

        const pontos =
            markersLayer.getLayers();

        if(pontos.length === 1){

            const ponto =
                pontos[0].getLatLng();

            map.setView(
                ponto,
                15
            );

        }
        else if(pontos.length > 1){

            const bounds =
                markersLayer.getBounds();

            map.fitBounds(
                bounds,
                {
                    padding: [40, 40],
                    maxZoom: 15
                }
            );
        }
    }

        mapa.style.height="calc(100vh - 210px)";

        this.innerHTML="▲";

    }

    else{

        dashboard.style.display="none";

        toolbar.style.display="none";

        mapa.style.height="calc(100vh - 60px)";

        this.innerHTML="▼";

    }

    map.invalidateSize();

};

    // =========================================
    // ESTADO DA AUTENTICAÇÃO
    // =========================================

    auth.onAuthStateChanged(
        user => {

            if(user){

                mostrarSistema();

                ativarLocalizacao();

                carregarDados();

            }
            else{

                ocultarSistema();

            }

        }
    );

    // =========================================
    // ATUALIZAÇÃO AUTOMÁTICA
    // =========================================

    setInterval(

        () => {

            if(auth.currentUser){

                carregarDados();

            }

        },

        300000

    );

</script>
